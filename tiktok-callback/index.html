<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok sign-in</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;line-height:1.6;color:#2b2b2b;background:#fffaf5}h1{color:#c2185b}a{color:#1565c0}code{background:#f1e9ff;padding:4px 8px;border-radius:6px;word-break:break-all;font-size:1.1em}</style></head><body><h1>TikTok sign-in</h1><p id="msg">Reading the sign-in result...</p><p><code id="code"></code></p><button id="copy" hidden>Copy code</button><script>
const p=new URLSearchParams(location.search),c=p.get('code'),e=p.get('error');
const m=document.getElementById('msg'),k=document.getElementById('code'),b=document.getElementById('copy');
if(c){m.textContent='Signed in. Copy this code and paste it into the Gib & Goob Uploader:';k.textContent=c;b.hidden=false;b.onclick=()=>navigator.clipboard.writeText(c).then(()=>b.textContent='Copied');}
else if(e){m.textContent='TikTok sign-in was not completed: '+e+(p.get('error_description')?' ('+p.get('error_description')+')':'');}
else{m.textContent='No sign-in code found on this page.';}
</script></body></html>
